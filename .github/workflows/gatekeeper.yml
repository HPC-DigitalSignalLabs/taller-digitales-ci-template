# Gatekeeper pipeline, the merge gate.
#
# Four complementary checks, each anchored to a domain:
#   1. functional verification in simulation   (open domain, container)
#   2. lint and style                          (open domain, non-blocking)
#   3. local synthesis-artifact validation     (bridge to the proprietary domain)
#   4. hardware validation on TARGET_BOARD    (Fase 3, self-hosted runner)
#
# Hygiene rules enforced here, all traceable to OE2:
#   * actions pinned by commit SHA, never by tag
#   * least-privilege permissions declared explicitly
#   * JUnit artifacts published even on failure, because a verdict with no
#     evidence is not a verdict
#   * a missing artifact is a failure, never a pass (dry-run scenario 3)
#
# Standalone copy generated by scripts/export_public_template.py in the TFG
# repository; the repository root is the verification template.

name: gatekeeper

on:
  push:
    branches: [master, main, dev]
  pull_request:
    branches: [master, main, dev]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      target_board:
        description: Quartus / hardware target board
        required: false
        default: de1_soc
        type: choice
        options:
          - de1_soc
          - de10_standard

permissions:
  contents: read

concurrency:
  group: gatekeeper-${{ github.ref }}
  cancel-in-progress: true

env:
  TARGET_BOARD: ${{ inputs.target_board || 'de1_soc' }}

jobs:
  # --- Check 1a: smoke ---------------------------------------------------------
  # Target: under 5 minutes. Runs on a hosted runner, not Kabré, because cluster
  # queue time alone would blow that budget.
  smoke:
    name: Smoke (open verification)
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.10'

      - name: Install pinned test dependencies
        run: python -m pip install --no-cache-dir -r .devcontainer/requirements.txt

      - name: Run the simulator-free subset
        run: make smoke

      - name: Require current smoke evidence
        if: always()
        run: test -s results/junit-smoke.xml && test -s results/report-smoke.md

      - name: Publish results
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: junit-smoke
          path: results/
          if-no-files-found: error

  # --- Check 1b: full functional verification ---------------------------------
  # Runs inside the pinned image, which is the same image used on Kabré. In
  # Fase 2 this job gains a dispatch path that submits a SLURM job array instead
  # of running the suite here.
  verification:
    name: Functional verification (Verilator + Icarus + CocoTB)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      # Same pinned Dockerfile, but its layers come from the GitHub Actions
      # cache: compiling Verilator, Icarus and Yosys from source took ~33 of
      # the ~38 minutes of this job. A Dockerfile change still invalidates
      # the affected layers and rebuilds them, so the cache never changes
      # which tool versions are tested.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the verification image (layer cache)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .devcontainer
          tags: digital-design-verify:ci
          load: true
          push: false
          cache-from: type=gha,scope=digital-design-verify
          cache-to: type=gha,mode=max,scope=digital-design-verify

      - name: Record the image under test
        run: docker image inspect digital-design-verify:ci --format '{{.Id}}' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run the suite in the image
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            -e JTAG_EXPORT_DIR=results \
            digital-design-verify:ci \
            make test

      - name: Require the complete two-simulator library regression
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            digital-design-verify:ci \
            bash -e -c 'make library-regression
              python3 tools/human_report.py \
                --junit results/junit-library.xml \
                --primary-junit results/junit-library.xml \
                --output results/report-library.md --require-pass'

      - name: Cross-check the smoke design against the second open-source simulator
        # S4 deliverable: the Kabre toolchain prototype is open-source and
        # covers both Verilator and Icarus, not Verilator alone. This does not
        # replace the Verilator-backed `make test` gate above; it proves the
        # counter design and its CocoTB testbench also build and pass under
        # Icarus, so a testbench convention violation that only one simulator
        # tolerates is caught here rather than in Fase 1.
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            digital-design-verify:ci \
            make sim SIM=icarus DESIGN=counter \
              SIM_BUILD=sim_build/icarus-counter-w8

      - name: Simulate the skid buffer with Icarus
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            digital-design-verify:ci \
            make sim SIM=icarus DESIGN=skid_buffer WIDTH=32 \
              SIM_BUILD=sim_build/icarus-skid-buffer-w32

      - name: Simulate the ALU with Icarus
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            digital-design-verify:ci \
            make sim SIM=icarus DESIGN=alu WIDTH=32 \
              SIM_BUILD=sim_build/icarus-alu-w32

      - name: Run open Cyclone V logical synthesis
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            digital-design-verify:ci \
            make synth-all

      - name: Require current verification evidence
        if: always()
        run: |
          test -s results/junit.xml
          test -s results/report-test.md
          test -s results/junit-library.xml
          test -s results/report-library.md
          test -s results/cocotb-icarus-counter-w8.xml
          test -s results/report-sim-icarus-counter-w8.md
          test -s results/cocotb-icarus-skid_buffer-w32.xml
          test -s results/report-sim-icarus-skid_buffer-w32.md
          test -s results/cocotb-icarus-alu-w32.xml
          test -s results/report-sim-icarus-alu-w32.md
          test -s results/report-synth-all.md
          test -s results/cocotb-verilator-jtag_counter-w8.xml
          test -s results/cocotb-icarus-jtag_counter-w8.xml
          test -s results/jtag-counter-verilator.json
          test -s results/jtag-counter-icarus.json

      - name: Publish results
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: junit-verification
          path: results/
          if-no-files-found: error

  # --- Check 2: lint and style -------------------------------------------------
  # Non-blocking by design. No OE depends on Verible, and a style opinion must
  # never block a correct design (see the Fase 0 time box).
  lint:
    name: Lint and style (Verible)
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Verible
        run: |
          VERSION=v0.0-4157-gfdbac312
          curl -sSL -o /tmp/verible.tar.gz \
            "https://github.com/chipsalliance/verible/releases/download/${VERSION}/verible-${VERSION}-linux-static-x86_64.tar.gz"
          tar -xzf /tmp/verible.tar.gz -C /tmp
          sudo cp /tmp/verible-*/bin/* /usr/local/bin/

      - name: Lint
        run: make lint

  # --- Check 3: synthesis artifact ---------------------------------------------
  # Quartus cannot run here: the license is node-locked. This job validates the
  # report the student produced on a lab station, binding it to the commit under
  # evaluation. It is what makes the local synthesis step auditable.
  #
  # Disabled until a real Quartus artifact is committed (Fase 1). Enabling it
  # against an absent artifact would fail correctly but uselessly.
  artifact-gate:
    name: Synthesis artifact gate
    if: false # enable in Fase 1, once a real artifact is committed
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.10'

      - name: Validate the artifact against this commit
        run: |
          python tools/artifact_gate.py \
            --repo . \
            --report "output_files/${DESIGN}.flow.rpt" \
            --commit "${GITHUB_SHA}" \
            --source-glob src \
            --source-glob lib \
            --source-glob quartus
        env:
          DESIGN: counter

  # Physical validation is deliberately not triggered by a push or PR.
  # fpga.yml implements separate approved build/program/replay dispatches
  # using the native station, exact SOF hashes and sealed CI references.
  # kabre.yml dispatches bounded campaigns through the operator's SSH runner.

  # --- Publish: image for Kabré ------------------------------------------------
  # Kabré never builds the image itself (login nodes are for light tasks only).
  # Convert the published OCI digest to SIF outside the cluster, then transfer
  # and verify its separate SIF hash before dispatch. Runs only on push (never on
  # pull_request, so a fork's PR cannot publish under this repo's namespace)
  # and only after ALL blocking gates are green (not just `verification`) --
  # otherwise a commit that fails `smoke` but passes `verification` could still
  # get its image published, decoupling "published to GHCR" from "passed the
  # gate", which is exactly the OE2 traceability guarantee this job exists for.
  publish-image:
    name: Publish verification image (GHCR)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    needs: [smoke, verification]
    if: github.event_name == 'push' && needs.smoke.result == 'success' && needs.verification.result == 'success'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Compute the lowercase image name
        # GHCR rejects uppercase in image paths; github.repository preserves
        # the repo's actual case (Katharsis0/TFG), so it cannot be used as-is.
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/digital-design-verify" >> "$GITHUB_ENV"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the verification image (layer cache)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .devcontainer
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          load: true
          push: false
          cache-from: type=gha,scope=digital-design-verify

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push commit-pinned tag
        run: |
          docker push "$IMAGE:$GITHUB_SHA"
          docker image inspect "$IMAGE:$GITHUB_SHA" --format '{{index .RepoDigests 0}}' > image-digest.txt
          grep -Eq '^ghcr\.io/.+@sha256:[0-9a-f]{64}$' image-digest.txt
          printf 'Published immutable image: `%s`\n' "$(cat image-digest.txt)" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish immutable image receipt
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: verification-image-digest
          path: image-digest.txt
          if-no-files-found: error

      - name: Push floating tag for the branch
        # A floating tag so `apptainer pull` on Kabré can grab "whatever is
        # green on this branch" without knowing a commit SHA in advance. The
        # commit-pinned tag above is what OE2's 1:1 reproducibility claim
        # actually rests on; this one is convenience only.
        run: |
          SAFE_REF=$(echo "${{ github.ref_name }}" | tr '/' '-')
          docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:$SAFE_REF"
          docker push "$IMAGE:$SAFE_REF"

  # --- Verdict -----------------------------------------------------------------
  # One required status check for branch protection, so adding a job does not
  # require editing the protection rule.
  gatekeeper:
    name: Gatekeeper verdict
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    needs: [smoke, verification]
    if: always()
    # This job never checks out the repo (it only echoes other jobs' results),
    # so the top-level `defaults.run.working-directory: template` has nothing
    # to `cd` into here and the runner fails before it can even start bash
    # ("No such file or directory" on template/). Override back to the
    # workspace root for this job only.
    defaults:
      run:
        working-directory: .
    steps:
      - name: Decide
        env:
          SMOKE_RESULT: ${{ needs.smoke.result }}
          VERIFICATION_RESULT: ${{ needs.verification.result }}
        run: |
          echo "smoke:        ${SMOKE_RESULT}"
          echo "verification: ${VERIFICATION_RESULT}"
          if [[ "${SMOKE_RESULT}" != "success" ]] \
            || [[ "${VERIFICATION_RESULT}" != "success" ]]; then
            echo "::error title=Gatekeeper::at least one required check did not pass"
            exit 1
          fi
          echo "All required checks passed."
